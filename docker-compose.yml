services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 96m
        reservations:
          memory: 16m

  # Upstash-compatible Redis REST proxy (serverless-redis-http)
  # @upstash/redis client'ı bu proxy üzerinden local Redis'e bağlanır.
  srh:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:-bagajpark-srh-secret}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 8m

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bagajpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bagajpark}
      POSTGRES_DB: ${POSTGRES_DB:-bagajpark}
    # pg_stat_statements için shared_preload_libraries PostGIS imajında ayrı ele alınmalı (çakışma riski).
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "4"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 64m

  web:
    image: ghcr.io/furkandogmus/emanetcim:latest
    build: .
    # Konteyner hostname’i yoksa Linux’ta rastgele id olur; log satırı için okunabilir isim.
    hostname: emanetci-web
    environment:
      # Next.js standalone server.js: bind adresi. Konteyner HOSTNAME’i bazen 127.0.0.1’e kilitlenir;
      # OAuth / vekil için AUTH_PUBLIC_HOST + AUTH_TRUST_HOST kullanın (0.0.0.0 URL üretmesin diye).
      HOSTNAME: "0.0.0.0"
      # OAuth redirect_uri kökü — tek kaynak (src/lib/auth-public-url.ts → AUTH_URL).
      AUTH_PUBLIC_HOST: ${AUTH_PUBLIC_HOST:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      AUTH_URL: ${AUTH_URL:-}
      DEBUG: ${DEBUG:-}
      PUBLIC_URL_PROTOCOL: ${PUBLIC_URL_PROTOCOL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bagajpark}:${POSTGRES_PASSWORD:-bagajpark}@postgres:5432/${POSTGRES_DB:-bagajpark}?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-docker-dev-change-me-use-openssl-rand-hex-32}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      MOBILE_PAYMENT_BYPASS: ${MOBILE_PAYMENT_BYPASS:-}
      MOBILE_PAYMENT_BYPASS_ALLOW_PROD: ${MOBILE_PAYMENT_BYPASS_ALLOW_PROD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Virgülle ayrılmış Google e-postaları; ilk girişte otomatik ADMIN rolü verilir
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # /api/admin/setup endpointini korur; boş bırakılırsa endpoint kapalıdır
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      # Netgsm SMS (esnaf + NETGSM_ADMIN_PHONES; misafir yok)
      NETGSM_USERNAME: ${NETGSM_USERNAME:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_MSGHEADER: ${NETGSM_MSGHEADER:-}
      NETGSM_APPNAME: ${NETGSM_APPNAME:-}
      NETGSM_ADMIN_PHONES: ${NETGSM_ADMIN_PHONES:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Upstash cloud credentials (öncelikli); boşsa local SRH proxy kullanılır
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-http://srh:80}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-${SRH_TOKEN:-bagajpark-srh-secret}}
      # Crisp canlı destek widget
      NEXT_PUBLIC_CRISP_WEBSITE_ID: ${NEXT_PUBLIC_CRISP_WEBSITE_ID:-}
      # Referans sistemi
      REFERRAL_DISCOUNT_PCT: ${REFERRAL_DISCOUNT_PCT:-5}
      NEXT_PUBLIC_REFERRAL_DISCOUNT_PCT: ${NEXT_PUBLIC_REFERRAL_DISCOUNT_PCT:-5}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-}
      PG_POOL_IDLE_MS: ${PG_POOL_IDLE_MS:-}
      PG_POOL_CONNECT_TIMEOUT_MS: ${PG_POOL_CONNECT_TIMEOUT_MS:-}
      DATABASE_SSL: ${DATABASE_SSL:-}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      APP_VERSION: ${APP_VERSION:-}
      OBSERVABILITY_SERVICE_NAME: ${OBSERVABILITY_SERVICE_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      srh:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"
    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 256m

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./nginx/conf.d/00-map.conf:/etc/nginx/conf.d/00-map.conf:ro
      - ./nginx/conf.d/01-hardening.conf:/etc/nginx/conf.d/01-hardening.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 16m

volumes:
  postgres_data:
