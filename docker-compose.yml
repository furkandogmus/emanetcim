services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emanetci
      POSTGRES_PASSWORD: emanetci
      POSTGRES_DB: emanetci
    # Host’ta 5432 doluysa çakışmayı önlemek için 5433 (iç ağda web→postgres:5432 değişmez)
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emanetci -d emanetci"]
      interval: 3s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://emanetci:emanetci@postgres:5432/emanetci?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-docker-dev-change-me-use-openssl-rand-hex-32}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
