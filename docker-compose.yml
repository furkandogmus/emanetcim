services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emanetci
      POSTGRES_PASSWORD: emanetci
      POSTGRES_DB: emanetci
    # Host’ta 5432 doluysa çakışmayı önlemek için 5433 (iç ağda web→postgres:5432 değişmez)
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emanetci -d emanetci"]
      interval: 3s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      # Docker varsayılan HOSTNAME=container_id; Next standalone bunu bind adresi yapıyor → 127.0.0.1:3000 healthcheck düşer.
      # 0.0.0.0 ile tüm arayüzler; Auth callback URL tarafında sanitize (auth-callback-url.ts) kullanılır.
      HOSTNAME:  ${GOOGLE_CLIENT_ID:-}
      DATABASE_URL: postgresql://emanetci:emanetci@postgres:5432/emanetci?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-docker-dev-change-me-use-openssl-rand-hex-32}
      # Boş: Auth.js isteğin Host / X-Forwarded-* ile URL üretir (ngrok, çoklu host).
      # Tek sabit domain (LAN emanetci.local) için docker-compose.env içinde AUTH_URL tanımlayın.
      AUTH_URL: ${AUTH_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Virgülle ayrılmış Google e-postaları; ilk girişte otomatik ADMIN rolü verilir
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # /api/admin/setup endpointini korur; boş bırakılırsa endpoint kapalıdır
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      # Netgsm SMS (esnaf + NETGSM_ADMIN_PHONES; misafir yok)
      NETGSM_USERNAME: ${NETGSM_USERNAME:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_MSGHEADER: ${NETGSM_MSGHEADER:-}
      NETGSM_APPNAME: ${NETGSM_APPNAME:-}
      NETGSM_ADMIN_PHONES: ${NETGSM_ADMIN_PHONES:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./nginx/conf.d/00-map.conf:/etc/nginx/conf.d/00-map.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
