services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bagajpark
      POSTGRES_PASSWORD: bagajpark
      POSTGRES_DB: bagajpark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagajpark -d bagajpark"]
      interval: 3s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 64m

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Konteyner hostname’i yoksa Linux’ta rastgele id olur; log satırı için okunabilir isim.
    hostname: emanetci-web
    environment:
      # Next.js standalone server.js: bind adresi. Konteyner HOSTNAME’i bazen 127.0.0.1’e kilitlenir;
      # OAuth / vekil için AUTH_PUBLIC_HOST + AUTH_TRUST_HOST kullanın (0.0.0.0 URL üretmesin diye).
      HOSTNAME: "0.0.0.0"
      # OAuth redirect_uri kökü — tek kaynak (src/lib/auth-public-url.ts → AUTH_URL).
      AUTH_PUBLIC_HOST: ${AUTH_PUBLIC_HOST:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      PUBLIC_URL_PROTOCOL: ${PUBLIC_URL_PROTOCOL:-}
      DATABASE_URL: postgresql://bagajpark:bagajpark@postgres:5432/bagajpark?schema=public
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-docker-dev-change-me-use-openssl-rand-hex-32}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Virgülle ayrılmış Google e-postaları; ilk girişte otomatik ADMIN rolü verilir
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # /api/admin/setup endpointini korur; boş bırakılırsa endpoint kapalıdır
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      # Netgsm SMS (esnaf + NETGSM_ADMIN_PHONES; misafir yok)
      NETGSM_USERNAME: ${NETGSM_USERNAME:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_MSGHEADER: ${NETGSM_MSGHEADER:-}
      NETGSM_APPNAME: ${NETGSM_APPNAME:-}
      NETGSM_ADMIN_PHONES: ${NETGSM_ADMIN_PHONES:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 256m

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./nginx/conf.d/00-map.conf:/etc/nginx/conf.d/00-map.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 16m

volumes:
  postgres_data:
