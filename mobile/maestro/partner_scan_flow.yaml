appId: com.bagajpark
---
# Partner Scan: QR tarama + kamera izni
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Partner girişi
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-partner@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Dashboard
- takeScreenshot: "partner-dashboard"

# === QR TARAMA ===
- tapOn: "QR Tara"
- assertVisible: "Kamera erişimi gerekli"
- assertVisible: "Kamera İznini Ver"
- takeScreenshot: "scan-permission"

# Kamera izni ver
- tapOn: "Kamera İznini Ver"
- tapOn: "İzin Ver"

# Tarama kılavuzu
- assertVisible: "Misafirin QR kodunu veya mühür barkodunu bu alana hizalayın"
- takeScreenshot: "scan-active"

# === MANUEL KOD GİRİŞ ===
- tapOn: "Kodu Gir"
- assertVisible: "Mühür Kodu"
- inputText: "BP-MHR-2024-001"
- tapOn: "Doğrula"
- takeScreenshot: "scan-manual-code"
