appId: com.bagajpark
---
# Checkout: valiz seçimi + ödeme + hata durumları
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Login
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Arama → dükkan detayı → checkout
# Konumu Kadıköy'e ayarla (adb emu geo fix 29.0255 40.9862 ile ayarlanmalı)
- tapOn: "Ara"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Maestro"
    timeout: 10000
- tapOn: "Maestro Test Dükkanı"

# Rezervasyon butonuna scroll
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Rezervasyon"

# Checkout ekranı
- assertVisible: "Rezervasyonu Tamamla"
- assertVisible: "Valiz Seçimi"
- takeScreenshot: "checkout-initial"

# === VALİZ BOYUTLARI ===
- assertVisible: "Küçük (S)"
- assertVisible: "Orta (M)"
- assertVisible: "Büyük (XL)"

# Küçük valiz seç
- tapOn: "Küçük (S)"
- takeScreenshot: "checkout-small-selected"

# Orta valiz seç
- tapOn: "Orta (M)"
- takeScreenshot: "checkout-medium-selected"

# Büyük valiz seç
- tapOn: "Büyük (XL)"
- takeScreenshot: "checkout-large-selected"

# === ÖDEME ÖZETİ ===
- swipe:
    direction: DOWN
    duration: 500
- assertVisible: "Toplam"
- assertVisible: "Güvenli 256-bit SSL Ödeme"
- takeScreenshot: "checkout-summary"

# === KUPON ===
- assertVisible: "İndirim Kuponu (Opsiyonel)"
- tapOn: "İndirim Kuponu (Opsiyonel)"
- inputText: "BAGAJ10"
- takeScreenshot: "checkout-coupon"

# === HATA: Valiz seçmeden ödeme ===
- tapOn: "Geri"
- tapOn: "Geri"
- tapOn: "Maestro Test Dükkanı"
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Rezervasyon"
- tapOn:
    text: "Ödemeyi Yap.*"
    optional: true
- assertVisible: "Lütfen en az bir valiz seçin."
- takeScreenshot: "checkout-error-no-bags"
