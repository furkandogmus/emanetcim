appId: com.bagajpark
---
# Checkout: valiz seçimi, ödeme özeti, hata durumları
- clearState
- launchApp
- tapOn: "Atla"

# Login
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- tapOn: "Giriş Yap"

# Arama → dükkan detayı → checkout
- tapOn: "Nerede valizini bırakmak istiyorsun?"
- inputText: "Kadıköy"
- pressKey: Enter
- tapOn: "Maestro Test Dükkanı"

# Rezervasyon butonuna scroll
- scrollUntilVisible:
    item: "Rezervasyon"
    direction: DOWN
- tapOn: "Rezervasyon"

# Checkout ekranı
- assertVisible: "Rezervasyonu Tamamla"
- assertVisible: "Valiz Seçimi"

# Valiz boyutları
- assertVisible: "Küçük (S)"
- assertVisible: "Orta (M)"
- assertVisible: "Büyük (XL)"

# Küçük valiz seç
- tapOn: "Küçük (S)"

# Ödeme özeti
- scrollUntilVisible:
    item: "Ödeme Özeti"
    direction: DOWN
- assertVisible: "Toplam"
- assertVisible: "Güvenli 256-bit SSL Ödeme"

# Kupon
- assertVisible: "İndirim Kuponu (Opsiyonel)"
- tapOn: "İndirim Kuponu (Opsiyonel)"
- inputText: "BAGAJ10"

- takeScreenshot: "checkout-review"
