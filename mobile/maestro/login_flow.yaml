appId: com.bagajpark
---
# Login: email + şifre + Giriş Yap
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Login ekranı
- assertVisible: "Hoş Geldiniz"

# Email ve şifre
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"

# Klavyeyi kapat ve butona tıkla
- pressKey: Back
- tapOn:
    point: "50%,70%"
    optional: true

# Ana sayfa
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Ana Sayfa"
- takeScreenshot: "login-success"
