appId: com.bagajpark
---
# Profile: profil düzenleme + bildirimler + yardım + çıkış
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Login
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Profil sekmesi
- tapOn: "Profil"
- assertVisible: "Hesabım"
- assertVisible: "Rezervasyon"
- takeScreenshot: "profile-screen"

# === PROFİL DÜZENLEME ===
- tapOn: "Profilimi Düzenle"
- assertVisible: "Profilimi Düzenle"
- assertVisible: "Ad Soyad"
- takeScreenshot: "profile-edit"

# İsim değiştir
- tapOn: "Ad Soyad"
- eraseText
- inputText: "Ahmet Güncellendi"

# Telefon değiştir
- assertVisible: "Telefon"
- tapOn: "Telefon"
- eraseText
- inputText: "5559876543"

# Kaydet
- tapOn: "Kaydet"
- takeScreenshot: "profile-saved"

# === BİLDİRİMLER ===
- tapOn: "Bildirimler"
- assertVisible: "Bildirimler"
- takeScreenshot: "notifications"
- tapOn: "Geri"

# === YARDIM ===
- tapOn: "Yardım Merkezi"
- assertVisible: "Yardım Merkezi"
- takeScreenshot: "help-center"
- tapOn: "Geri"

# === ÇIKIŞ ===
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Çıkış Yap"
- assertVisible: "Hesabınızdan çıkış yapmak istediğinize emin misiniz?"
- tapOn: "Evet"
- assertVisible: "Hoş Geldiniz"
- takeScreenshot: "logged-out"
