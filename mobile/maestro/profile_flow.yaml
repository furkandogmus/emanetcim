appId: com.bagajpark
---
# Profile: profil düzenle, bildirimler, yardım, çıkış
- clearState
- launchApp
- tapOn: "Atla"

# Login
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- tapOn: "Giriş Yap"

# Profil sekmesi
- tapOn: "Profil"
- assertVisible: "Hesabım"
- assertVisible: "Misafir"
- assertVisible: "Rezervasyon"

# Profil düzenleme
- tapOn: "Profilimi Düzenle"
- assertVisible: "Profilimi Düzenle"
- assertVisible: "Ad Soyad"
- tapOn: "Ad Soyad"
- eraseText
- inputText: "Ahmet Güncellendi"
- assertVisible: "Telefon"
- tapOn: "Kaydet"

# Bildirimler
- tapOn: "Bildirimler"
- assertVisible: "Bildirimler"
- tapOn: "Geri"

# Yardım
- tapOn: "Yardım Merkezi"
- assertVisible: "Yardım Merkezi"
- takeScreenshot: "profile-help"
