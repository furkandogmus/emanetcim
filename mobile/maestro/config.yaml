# Maestro E2E Test Konfigürasyonu
# https://maestro.mobile.dev

flows:
  - login_flow.yaml
  - register_flow.yaml
  - password_reset_flow.yaml
  - search_filter_flow.yaml
  - checkout_flow.yaml
  - booking_flow.yaml
  - profile_flow.yaml
  - partner_seals_flow.yaml
  - partner_scan_flow.yaml
  - partner_booking_management_flow.yaml
  - admin_dashboard_flow.yaml

# Sifreler REPOYA YAZILMAZ: repo herkese acik ve bu hesaplar prod'da (admin
# dahil). 2026-10-18'e kadar burada duz metin duruyordu; uc hesabin sifresi
# degistirildi. Calistirirken verin:
#   maestro test mobile/maestro -e GUEST_PASSWORD=... -e PARTNER_PASSWORD=... -e ADMIN_PASSWORD=...
env:
  APP_ID: "com.bagajpark"
  GUEST_EMAIL: "maestro-guest@bagajpark.com"
  PARTNER_EMAIL: "maestro-partner@bagajpark.com"
  ADMIN_EMAIL: "maestro-admin@bagajpark.com"

executionOrder:
  continueOnFailure: false

onFlowStart:
  - stopApp

onFlowComplete:
  - takeScreenshot: "flow-complete"

onError:
  - takeScreenshot: "flow-error"
