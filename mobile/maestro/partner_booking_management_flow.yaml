appId: com.bagajpark
---
# Partner Booking Management: dashboard + filtreleme + kazanç + ayarlar
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Partner girişi
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-partner@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Dashboard
- takeScreenshot: "partner-dashboard"

# === FİLTRELEME ===
- assertVisible: "Tümü"
- assertVisible: "Onay Bekleyen"
- assertVisible: "Aktif"
- assertVisible: "Tamamlandı"

# Onay bekleyen
- tapOn: "Onay Bekleyen"
- takeScreenshot: "partner-waiting"

# Aktif
- tapOn: "Aktif"
- takeScreenshot: "partner-active"

# Tamamlandı
- tapOn: "Tamamlandı"
- takeScreenshot: "partner-completed"

# Tümü
- tapOn: "Tümü"
- takeScreenshot: "partner-all"

# === KAZANÇ ===
- tapOn: "Kazançlarım"
- assertVisible: "Kazançlarım"
- assertVisible: "Toplam Bakiye"
- assertVisible: "Ödeme Geçmişi"
- takeScreenshot: "partner-earnings"

# === DÜKKAN AYARLARI ===
- tapOn: "Dükkan Ayarları"
- assertVisible: "Dükkan Adı"
- assertVisible: "Çalışma Saatleri"
- assertVisible: "Günlük Fiyat"
- takeScreenshot: "partner-settings"

# Dükkan adı değiştir
- tapOn: "Dükkan Adı"
- eraseText
- inputText: "Maestro Test Dükkanı Güncellendi"
- tapOn: "Kaydet"
- takeScreenshot: "partner-settings-saved"
