appId: com.bagajpark
---
# Admin Dashboard: istatistikler, başvurular, sistem durumu
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Admin girişi
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-admin@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    point: "50%,70%"
    optional: true

# Yönetim Paneli
- assertVisible: "Yönetim Paneli"
- assertVisible: "Toplam Rezervasyon"
- assertVisible: "Toplam Gelir"
- assertVisible: "Aktif Esnaf"
- assertVisible: "Bekleyen Başvurular"
- assertVisible: "Tüm Sistemler Aktif"
- takeScreenshot: "admin-dashboard"

# Hızlı İşlemler
- assertVisible: "Başvuruları Onayla"
- assertVisible: "Destek Mesajları"
- assertVisible: "Canlı İstatistikler"
