appId: com.bagajpark
---
# Admin Dashboard: login + istatistikler + başvurular + sistem durumu
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Admin girişi
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-admin@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Yönetim Paneli
- takeScreenshot: "admin-dashboard"

# === İSTATİSTİKLER ===
- assertVisible: "Toplam Rezervasyon"
- assertVisible: "Toplam Gelir"
- assertVisible: "Aktif Esnaf"
- assertVisible: "Bekleyen Başvurular"
- takeScreenshot: "admin-stats"

# === HIZLI İŞLEMLER ===
- assertVisible: "Başvuruları Onayla"
- assertVisible: "Destek Mesajları"
- assertVisible: "Canlı İstatistikler"

# === BAŞVURULAR ===
- tapOn: "Başvuruları Onayla"
- assertVisible: "Esnaf Başvuruları"
- takeScreenshot: "admin-applications"

# === DESTEK MESAJLARI ===
- tapOn: "Geri"
- tapOn: "Destek Mesajları"
- assertVisible: "Destek Mesajları"
- takeScreenshot: "admin-messages"

# === SİSTEM DURUMU ===
- tapOn: "Geri"
- assertVisible: "Tüm Sistemler Aktif"
- takeScreenshot: "admin-system-status"
