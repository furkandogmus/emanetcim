appId: com.bagajpark
---
# Onboarding 4 sayfa, ileri butonu ikon, son sayfada "Bitti"
- clearState
- launchApp

# Sayfa 1
- assertVisible: "Bul & Rezerve Et"
- assertVisible: "Atla"

# Swipe → Sayfa 2
- swipe:
    direction: LEFT
    duration: 400
- assertVisible: "Bırak & QR Okut"

# Swipe → Sayfa 3
- swipe:
    direction: LEFT
    duration: 400
- assertVisible: "Mühürle & Güvende Ol"

# Swipe → Sayfa 4 (son)
- swipe:
    direction: LEFT
    duration: 400
- assertVisible: "Özgürce Keşfet"
- assertVisible: "Bitti"

# Bitti → Login
- tapOn: "Bitti"
- assertVisible: "Hoş Geldiniz"

# === TEKRAR ONBOARDING: Hemen Atla ===
- stopApp
- launchApp
- tapOn: "Atla"
- assertVisible: "Hoş Geldiniz"
