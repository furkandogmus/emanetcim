appId: com.bagajpark
---
# Onboarding: tam tur + atlama
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

# Sayfa 1
- assertVisible: "Bul & Rezerve Et"
- assertVisible: "Atla"

# Sayfa 2'ye geç
- swipe:
    direction: LEFT
    duration: 400
- assertVisible: "Bırak & QR Okut"

# Sayfa 3'e geç
- swipe:
    direction: LEFT
    duration: 400
- assertVisible: "Mühürle & Güvende Ol"

# Sayfa 4'e geç (son)
- swipe:
    direction: LEFT
    duration: 400
- assertVisible: "Özgürce Keşfet"
- assertVisible: "Bitti"

# Bitti → Login
- tapOn: "Bitti"
- assertVisible: "Hoş Geldiniz"
- takeScreenshot: "onboarding-complete"

# === TEKRAR: Atla testi ===
- stopApp
- launchApp
- tapOn: "Atla"
- assertVisible: "Hoş Geldiniz"
- takeScreenshot: "onboarding-skip"
