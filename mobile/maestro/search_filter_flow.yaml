appId: com.bagajpark
---
# Search: arama + filtreleme + sıralama
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Login
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Ara sekmesi
- tapOn: "Ara"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Filtrele"
- takeScreenshot: "search-initial"

# === FİLTRELEME ===
- tapOn: "Filtrele"
- assertVisible: "Filtrele"
- assertVisible: "Şimdi Açık"
- assertVisible: "7/24 Açık"
- assertVisible: "Sıralama"

# Açık şimdi filtresi
- tapOn: "Şimdi Açık"
- tapOn: "Sonuçları Göster"
- takeScreenshot: "search-filtered"

# === DÜKKAN DETAYI ===
- tapOn: "Maestro Test Dükkanı"
- assertVisible: "Yol Tarifi"
- assertVisible: "Dükkan Hakkında"

# Olanaklar
- swipe:
    direction: DOWN
    duration: 500
- assertVisible: "Olanaklar"
- takeScreenshot: "shop-amenities"

# Favori ekle
- tapOn: "Favorilere Ekle"
- takeScreenshot: "shop-favorited"
