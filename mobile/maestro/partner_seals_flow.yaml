appId: com.bagajpark
---
# === GİRİŞ (PARTNER) ===
- clearState
- launchApp
- tapOn: "Atla"
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-partner@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- tapOn: "Giriş Yap"

# === PROFİL → MÜHÜR YÖNETİMİ ===
- tapOn: "Profil"
- scrollUntilVisible:
    item: "Mühür Yönetimi"
    direction: DOWN
- tapOn: "Mühür Yönetimi"
- assertVisible: "Mühür Yönetimi"

# === HAPPY PATH: Mühür talep et ===
- tapOn: "Talep Adeti"
- eraseText
- inputText: "20"
- tapOn: "Mühür Talep Et"
- assertVisible: "Mühür talebi başarıyla oluşturuldu."

# === HAPPY PATH: Az adet talep ===
- tapOn: "Talep Adeti"
- eraseText
- inputText: "5"
- tapOn: "Mühür Talep Et"
- assertVisible: "Mühür talebi başarıyla oluşturuldu."

# === HATA BİLDİRME ===
- tapOn: "Arızalı Mühür Bildir"
- assertVisible: "Mühür Seri Numarası"
- inputText: "BP-2024-001"
- tapOn: "Bildir"
- assertVisible: "Arızalı mühür başarıyla bildirildi."

# === EKRAN GÖRÜNTÜSÜ ===
- takeScreenshot: "seal-management"
