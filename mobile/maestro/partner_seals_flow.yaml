appId: com.bagajpark
---
# Partner Seals: mühür talep et, arızalı bildir
- clearState
- launchApp
- tapOn: "Atla"

# Partner girişi
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-partner@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- tapOn: "Giriş Yap"

# Dashboard kontrolü
- assertVisible: "Dükkan Paneli"
- assertVisible: "Aktif Valiz"
- assertVisible: "Toplam Kazanç"

# Profil → Mühür Yönetimi
- tapOn: "Profil"
- scrollUntilVisible:
    item: "Mühür Yönetimi"
    direction: DOWN
- tapOn: "Mühür Yönetimi"
- assertVisible: "Mühür Yönetimi"

# Mühür talep et
- tapOn: "Talep Adeti"
- eraseText
- inputText: "20"
- tapOn: "Mühür Talep Et"
- assertVisible: "Mühür talebi başarıyla oluşturuldu."

# Az adet talep
- tapOn: "Talep Adeti"
- eraseText
- inputText: "5"
- tapOn: "Mühür Talep Et"
- assertVisible: "Mühür talebi başarıyla oluşturuldu."

# Arızalı mühür bildir
- tapOn: "Arızalı Mühür Bildir"
- assertVisible: "Mühür Seri Numarası"
- inputText: "BP-2024-001"
- tapOn: "Bildir"
- assertVisible: "Arızalı mühür başarıyla bildirildi."

- takeScreenshot: "seal-management"
