appId: com.bagajpark
---
# Partner Seals: sadece login + dashboard
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Partner girişi
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-partner@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    point: "50%,70%"
    optional: true

# Dashboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "partner-dashboard"
