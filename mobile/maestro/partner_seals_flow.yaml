appId: com.bagajpark
---
# Partner Seals: login + dashboard + mühür yönetimi
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Partner girişi
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-partner@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Dashboard
- takeScreenshot: "partner-dashboard"

# Filtreler
- assertVisible: "Tümü"
- assertVisible: "Onay Bekleyen"
- assertVisible: "Aktif"
- assertVisible: "Tamamlandı"

# Onay bekleyen filtrele
- tapOn: "Onay Bekleyen"
- takeScreenshot: "partner-filtered"

# === PROFİL → MÜHÜR YÖNETİMİ ===
- tapOn: "Profil"
- swipe:
    direction: DOWN
    duration: 500
- tapOn: "Mühür Yönetimi"
- assertVisible: "Mühür Yönetimi"
- takeScreenshot: "seal-management"

# === MÜHÜR TALEP ET ===
- assertVisible: "Talep Adeti"
- tapOn: "Talep Adeti"
- eraseText
- inputText: "20"
- tapOn: "Mühür Talep Et"
- assertVisible: "Mühür talebi başarıyla oluşturuldu."
- takeScreenshot: "seal-request-success"

# === AZ ADET TALEP ===
- tapOn: "Talep Adeti"
- eraseText
- inputText: "5"
- tapOn: "Mühür Talep Et"
- assertVisible: "Mühür talebi başarıyla oluşturuldu."

# === HATA: Sınır dışı değer ===
- tapOn: "Talep Adeti"
- eraseText
- inputText: "150"
- tapOn: "Mühür Talep Et"
- assertVisible: "En fazla 100 mühür talep edebilirsiniz"
- takeScreenshot: "seal-request-error"

# === ARIZALI MÜHÜR BİLDİR ===
- tapOn: "Arızalı Mühür Bildir"
- assertVisible: "Mühür Seri Numarası"
- inputText: "BP-2024-001"
- tapOn: "Bildir"
- assertVisible: "Arızalı mühür başarıyla bildirildi."
- takeScreenshot: "seal-faulty-reported"
