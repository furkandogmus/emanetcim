appId: com.bagajpark
---
# Booking: arama → dükkan detay → checkout
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Login
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- pressKey: Back
- tapOn:
    text: "Giriş Yap.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Ana Sayfa"

# Popüler şehirler
- assertVisible: "İstanbul"
- assertVisible: "Ankara"

# Arama
- tapOn: "Ara"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "search-screen"
