appId: com.bagajpark
---
# Booking: arama → dükkan detay → checkout
- clearState
- launchApp
- tapOn: "Atla"

# Login
- tapOn: "E-posta veya Telefon"
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Şifre"
- inputText: "Test123!"
- tapOn: "Giriş Yap"
- assertVisible: "Nasıl Çalışır?"

# Popüler şehirler
- assertVisible: "İstanbul"
- assertVisible: "Ankara"

# Arama
- tapOn: "Nerede valizini bırakmak istiyorsun?"
- inputText: "Kadıköy"
- pressKey: Enter
- assertVisible: "Filtrele"

# Dükkan detayı
- tapOn: "Maestro Test Dükkanı"
- assertVisible: "Yol Tarifi"

# Dükkan bilgileri
- scrollUntilVisible:
    item: "Değerlendirmeler"
    direction: DOWN
- assertVisible: "Çalışma Saatleri"
- takeScreenshot: "shop-detail"
