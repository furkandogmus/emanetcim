appId: com.bagajpark
---
# Şifre sıfırlama: sadece UI/validasyon testi, e-posta gönderilmez
- clearState
- launchApp
- tapOn: "Atla"

# Şifremi Unuttum → sıfırlama bilgi mesajı
- tapOn: "Şifremi Unuttum"
- assertVisible: "Şifre sıfırlama sadece e-posta adresi ile yapılabilir. Lütfen e-posta adresinizi girin."

# === ERROR: Boş form ===
- tapOn: "Giriş Yap"
- assertVisible: "Lütfen önce e-posta adresinizi girin"

# === ERROR: Telefon girince uyarı ===
- tapOn: "E-posta veya Telefon"
- inputText: "5551234567"
- tapOn: "Giriş Yap"
- assertVisible: "Şifre sıfırlama sadece e-posta adresi ile yapılabilir"

# Geri dön
- tapOn: "Geri"
- assertVisible: "Hoş Geldiniz"
