appId: com.bagajpark
---
# Password Reset: şifre sıfırlama + validasyon
- clearState
- launchApp

# Root/jailbreak uyarısını kapat
- tapOn:
    text: "Riskleri Anladım, Devam Et"
    optional: true

- tapOn: "Atla"

# Şifremi Unuttum
- assertVisible: "Hoş Geldiniz"
- tapOn: "Şifremi Unuttum"
- assertVisible: "Şifre sıfırlama sadece e-posta adresi ile yapılabilir"
- takeScreenshot: "password-reset-info"

# === ERROR: Boş form ===
- tapOn: "Giriş Yap.*"
- assertVisible: "Lütfen önce e-posta adresinizi girin"
- takeScreenshot: "password-reset-empty"

# === ERROR: Telefon girince uyarı ===
- tapOn: "E-posta veya Telefon"
- inputText: "5551234567"
- tapOn: "Giriş Yap.*"
- assertVisible: "Şifre sıfırlama sadece e-posta adresi ile yapılabilir"
- takeScreenshot: "password-reset-phone-error"

# === HAPPY PATH: Email gir ===
- tapOn: "E-posta veya Telefon"
- eraseText
- inputText: "maestro-guest@bagajpark.com"
- tapOn: "Giriş Yap.*"
- assertVisible: "Şifre sıfırlama bağlantısı e-posta adresinize gönderildi"
- takeScreenshot: "password-reset-success"

# Geri dön
- tapOn: "Geri"
- assertVisible: "Hoş Geldiniz"
