appId: com.bagajpark
---
# Not: Gerçek şifre sıfırlama e-posta gönderir.
# Bu flow sadece UI validasyonu ve hata senaryolarını test eder.

# === NAVIGASYON ===
- clearState
- launchApp
- tapOn: "Atla"

- assertVisible: "Hoş Geldiniz"
- tapOn: "Şifremi Unuttum"
- assertVisible: "Şifre sıfırlama sadece e-posta adresi ile yapılabilir. Lütfen e-posta adresinizi girin."

# === ERROR: Boş form ===
- tapOn: "Kod Gönder"
- assertVisible: "Lütfen önce e-posta adresinizi girin."

# === ERROR: Geçersiz email ===
- tapOn: "E-posta veya Telefon"
- inputText: "gecersiz-email"
- tapOn: "Kod Gönder"
- assertVisible: "Geçersiz e-posta veya telefon numarası"
