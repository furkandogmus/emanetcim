<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ea580c" />
    <title>Çevrimdışı — BagajPark</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #171717;
        padding: 1.5rem;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.875rem;
        color: #525252;
        margin: 0 0 1.25rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: #ea580c;
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı yok</h1>
      <p>
        İnternet bağlantınızı kontrol edip tekrar deneyin. No connection — check your network and try again.
      </p>
      <p><a href="/">Ana sayfa / Home</a></p>
    </main>
  </body>
</html>
