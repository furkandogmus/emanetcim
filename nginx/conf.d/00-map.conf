map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Auth.js OAuth redirect_uri: proto boş veya içeriden http iken dışarıdan https (ngrok) olmalı.
# $http_x_forwarded_proto:$host birleşik anahtar — ngrok hostlarında https zorlanır.
map "$http_x_forwarded_proto:$host" $forwarded_proto_raw {
    "~^https:.+" "https";
    "~^:.*\.ngrok-free\.dev$" "https";
    "~^http:.*\.ngrok-free\.dev$" "https";
    "~^:.*\.ngrok\.io$" "https";
    "~^http:.*\.ngrok\.io$" "https";
    "~^:.*\.ngrok\.app$" "https";
    "~^http:.*\.ngrok\.app$" "https";
    default $http_x_forwarded_proto;
}

map $forwarded_proto_raw $forwarded_proto {
    default $forwarded_proto_raw;
    ""      $scheme;
}

# ngrok / ters vekil: istemcinin ilettiği host’u Next.js’e aktar (Auth.js)
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}
