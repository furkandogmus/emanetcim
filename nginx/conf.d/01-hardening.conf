# http bloğu içinde (conf.d/*.conf) — Server başlığında nginx sürümünü gösterme
server_tokens off;

# Rate limiting zones
# Genel API: IP başına 30 istek/saniye (burst 60)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
# Auth endpoint'leri (login, register, /api/auth/session): IP başına 180 istek/dakika
# Not: next-auth session kontrolleri sayfa gezintisinde sık tetiklenebildiği için
# çok düşük değerler normal kullanıcıda false-positive 429 üretebilir.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=180r/m;
# Webhook: IP başına 60 istek/saniye
limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=60r/s;
# Sağlık kontrolü — /api/health/jobs için, IP başına 12 istek/dakika (5 saniyede 1).
# NEDEN AYRI VE BU KADAR DAR: uç kimlik doğrulaması olmadan HERKESE AÇIK (bilerek —
# sırsız olsun ki herhangi bir izleyici alarm verebilsin) ama tek çağrıda ~18 sorgu
# koşuyor, `seal.count()` gibi tam tablo sayımları dahil. `api_general` altında (30r/s,
# burst 120) tek bir IP veritabanına saniyede ~540 sorgu yaptırabiliyordu.
# 12r/m bir izleyici (30 dk aralık) ve olay anında elle curl atan bir insan için fazlasıyla
# yeterli; kaba kuvvet için değil. `/api/health/live` KAPSAM DIŞI — sıfır sorgu koşuyor,
# nginx'in kendi healthcheck'i onu 5 saniyede bir çağırıyor ve limitlenirse konteyner
# unhealthy'e düşer.
limit_req_zone $binary_remote_addr zone=api_health:10m rate=12r/m;

# Bağlantı sınırı: aynı IP'den max 50 eşzamanlı bağlantı
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Rate limit aşıldığında 429 dön (varsayılan 503)
limit_req_status 429;
limit_conn_status 429;
