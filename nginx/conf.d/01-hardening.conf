# http bloğu içinde (conf.d/*.conf) — Server başlığında nginx sürümünü gösterme
server_tokens off;

# Rate limiting zones
# Genel API: IP başına 30 istek/saniye (burst 60)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
# Ödeme endpoint'leri: IP başına 5 istek/saniye (daha katı)
limit_req_zone $binary_remote_addr zone=api_payment:10m rate=5r/s;
# Auth endpoint'leri (login, register, /api/auth/session): IP başına 180 istek/dakika
# Not: next-auth session kontrolleri sayfa gezintisinde sık tetiklenebildiği için
# çok düşük değerler normal kullanıcıda false-positive 429 üretebilir.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=180r/m;
# Webhook: IP başına 60 istek/saniye (iyzico/Stripe yüksek hacim gönderebilir)
limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=60r/s;

# Bağlantı sınırı: aynı IP'den max 50 eşzamanlı bağlantı
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Rate limit aşıldığında 429 dön (varsayılan 503)
limit_req_status 429;
limit_conn_status 429;
