name: CI

# =============================================================================
# TEK GIRIS NOKTASI: dogrula -> imaj -> deploy.
#
# NEDEN BOYLE (2026-08-26'da olculdu): `CI` ve `Build & Deploy` AYRI iki
# workflow'du ve ikisi de `main` push'unda tetikleniyordu. Sonuclari:
#
#   1. Next uygulamasi push BASINA UC KEZ derleniyordu -- `build` job'inda,
#      `e2e` job'inda bir daha (ayri job, `.next`i paylasamiyor) ve bir de
#      Docker imajinin icinde.
#   2. `Build & Deploy`, `CI`yi BEKLEMIYORDU. Yani testleri kirmizi olan bir
#      commit uretime cikabiliyordu; ikisini birbirine baglayan hicbir sey yoktu.
#   3. Ustuste gelen push'lar iptal edilmiyordu. Ayni gun 58 kosu tetiklendi;
#      her biri, kendisinden sonra gelen commit onu gecersiz kilmis olsa bile
#      sonuna kadar kosuyordu.
#
# Agustos faturasi: 1547 dk (CI 918, Build & Deploy 611) -- private repo
# kotasi 2000 dk/ay. Kota bitince job'lar 0 adimda, ~3 saniyede dusuyor ve
# hicbir log birakmiyor; "test kirildi" gibi degil, "hicbir sey olmadi" gibi
# gorunur. Bu dosyanin bicimi o faturayi dusurmek icin.
#
# KURALLAR:
#   - Deploy, dogrulamanin HER parcasina BAGLI (`needs`). Kirmizi commit cikamaz.
#   - Uretim imaji dogrulamayla PARALEL derlenir ama `latest` etiketini yalnizca
#     deploy, dogrulama gectikten SONRA verir (asagida `image` ve `deploy`).
#   - Tek Next build (E2E icin) + imajin kendi build'i -- o BILEREK ayri.
#   - Ustuste gelen kosular iptal olur.
# =============================================================================

on:
  push:
    branches: [main]
    # Bu yollar uygulamanin davranisini degistirmez; tam pipeline'i hak etmiyorlar.
    paths-ignore:
      - "docs/**"
      - "ops/**"
      - "**/*.md"
  # PR'da yol filtresi YOK (2026-09-23): `verify` main'de ZORUNLU kontrol. Yol
  # filtresi yuzunden hic calismayan bir zorunlu kontrol PR'i sonsuza dek
  # "bekliyor"da birakir. Kapsam asagidaki `changes` job'unda olculur;
  # uygulamaya dokunmayan PR'da dogrulama job'lari KOSULLA atlanir ve
  # `verify` toplayicisi yesil doner.
  pull_request:
    branches: [main]
  # Path filtresi yuzunden atlanan bir degisikligi elle dogrulamak icin.
  workflow_dispatch:

# Iptal WORKFLOW seviyesinde DEGIL, job seviyesinde tanimli.
#
# NEDEN: workflow seviyesinde `cancel-in-progress: true` yazmak, yeni bir push
# geldiginde SUREN BIR DEPLOY'U da yarida keserdi -- S3 yuklemesi bitmis ama
# SSM komutu beklenirken kesilen bir kosu, sunucuyu yari guncellenmis birakir
# ve workflow "iptal edildi" der. Pahali olan is dogrulama (`checks`, `e2e`)
# ve imaj; iptal edilmesi gereken de onlardir. `deploy` asla kesilmez, ustelik kendi grubunda sirayla
# calisir (asagiya bakin).

# Varsayilan GITHUB_TOKEN izni en dar haline cekildi (CodeQL
# `missing-workflow-permissions`, 2026-09-06). Dogrulama hicbir yere yazmiyor,
# yalnizca checkout icin `contents: read` yeterli. `image`/`deploy` kendi
# ihtiyaclarini (packages: write / id-token: write) zaten job seviyesinde
# ayrica tanimliyor -- bu varsayilani ELE GECIRMEZ, yalnizca genisletir.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PR'in uygulamaya dokunup dokunmadigi. Push/dispatch'te her zaman `true`:
  # push'un kendi `paths-ignore`'u zaten filtreliyor.
  # ---------------------------------------------------------------------------
  changes:
    name: Degisiklik kapsami
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.kapsam.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: kapsam
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # docs/, ops/ ve .md disinda tek bir dosya bile varsa uygulama degisti.
          if git diff --name-only "origin/${BASE}...HEAD" | grep -qvE '^(docs/|ops/)|\.md$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Dogrulama IKI paralel job: `checks` (statik kapilar + DB + birim) ve
  # `e2e` (build + seed + Playwright). Tek job'da sirayla ~6 dk suruyordu;
  # ikisi ayri makinede, en uzun kol kadar surer. `node_modules` lockfile
  # hash'iyle onbellekten gelir, iki `npm ci`nin bedeli boylece kalkar.
  # Next build hala TEK (yalnizca `e2e`de).
  # ---------------------------------------------------------------------------
  checks:
    name: Dogrula / statik + birim
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ayni dala arka arkaya push atilirsa yalnizca sonuncusu dogrulanir.
    concurrency:
      group: verify-checks-${{ github.ref }}
      cancel-in-progress: true

    # Entegrasyon testleri ve db:verify gercek Postgres/Redis ister.
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-e2e-secret-not-for-production-0123456789
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-e2e-cron-secret
      E2E_DISABLE_RATE_LIMIT: "true"
      NEXT_PUBLIC_ENABLE_AUTH_DEMO: "true"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "22"

      # Anahtar package.json + lockfile + Node surumu: biri degisirse iska olur
      # ve `npm ci` kosar. package.json anahtarda, cunku `npm ci` ikisinin
      # uyumsuzlugunu da yakalayan bir kapidir; isabette o kapi atlanmamali.
      # Isabette `postinstall` (prisma generate) calismaz, elle cagrilir:
      # sema degisip lockfile degismezse istemci bayat kalirdi.
      - name: node_modules onbellegi
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Bagimliliklar
        env:
          HIT: ${{ steps.nm-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            npx prisma generate
          else
            npm ci
          fi

      # Hemen kaydedilir: job sonunda kaydetmek testlerin yazdigi seyleri de
      # onbellege tasirdi.
      - name: node_modules onbellegini kaydet
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.nm-cache.outputs.cache-primary-key }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # nginx konfigi 2026-08-30'dan beri deploy ile CANLIYA gidiyor (asagidaki
      # deploy isinde nginx/conf.d senkronu). Yani bozuk bir konfig artik siteyi
      # kapatabilir; bu kapi onu S3'e ULASMADAN once durdurur.
      #
      # `--engine docker` ZORUNLU, apt'teki nginx DEGIL: Ubuntu 24.04 nginx 1.24
      # veriyor ve o surum `http2 on;` direktifini tanimiyor (1.25.1'de geldi).
      # Ilk denemede kapi tam da bu yuzden DOGRU bir konfigi reddetti. Imaj
      # docker-compose.yml'den okunuyor, yani uretimin kosturdugu surumun ta
      # kendisi. Runner'da docker hazir kurulu.
      - name: nginx konfig dogrulamasi
        run: bash scripts/verify-nginx-conf.sh --engine docker

      # Prod bagimliliklarinda yuksek/kritik CVE varsa burada durur.
      # Bilincli tasinan istisnalar gerekce + gozden gecirme tarihiyle
      # scripts/audit-deps.mjs icinde; tarih gecince kapi yine kirilir.
      - name: Bagimlilik acigi taramasi
        run: npm run audit

      - name: Prisma migrate (CI DB)
        run: npx prisma migrate deploy

      # Migrasyonlarin urettigi sema, schema.prisma ile BIREBIR mi?
      #
      # NEDEN: sekiz migrasyon elle yazilmisti ve hicbiri gercek bir Postgres'e
      # karsi denenmemisti. Denendiginde iki sapma cikti (PaymentLog.updatedAt
      # varsayilani ve semada bildirilmemis bir Shop indeksi). Ikisi de deploy'u
      # kirmazdi ama bir sonraki `migrate dev` calistiran kisiye aciklanamayan
      # bir drift olarak cikardi.
      - name: Migrasyon / sema sapma kontrolu
        run: npm run db:verify -- --host localhost --port 5432 --user ci
        env:
          PGPASSWORD: ci

      - name: Birim + entegrasyon testleri
        run: npm run test

  e2e:
    name: Dogrula / build + E2E
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: verify-e2e-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-e2e-secret-not-for-production-0123456789
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      CRON_SECRET: ci-e2e-cron-secret
      # Testler ayni IP'den onlarca istek uretir; gercek limitler production disinda kapatilir.
      E2E_DISABLE_RATE_LIMIT: "true"
      # Demo giris dugmeleri production build'de ancak bu bayrakla gorunur (build aninda gomulur).
      #
      # DIKKAT: bu bayrak SADECE dogrulama job'larinda acik. Uretime giden imaj
      # asagida AYRI bir job'da, bu env olmadan derleniyor -- E2E build'ini
      # uretim imaji olarak yeniden kullanmamamizin sebebi tam olarak bu.
      NEXT_PUBLIC_ENABLE_AUTH_DEMO: "true"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "22"

      # Anahtar ve kurallar `checks` job'undakiyle ayni; ikisi ayni girdiyi paylasir.
      - name: node_modules onbellegi
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Bagimliliklar
        env:
          HIT: ${{ steps.nm-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            npx prisma generate
          else
            npm ci
          fi

      - name: node_modules onbellegini kaydet
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.nm-cache.outputs.cache-primary-key }}

      - name: Build
        run: npm run build

      # Tarayici ikilisi ~150 MB ve her kosuda yeniden indiriliyordu.
      # Anahtar Playwright surumune bagli: paket yukseltilince otomatik tazelenir.
      - name: Playwright surumunu oku
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright tarayici onbellegi
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Playwright tarayicilari
        # Onbellek tuttuysa yalnizca sistem bagimliliklari kurulur, indirme olmaz.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Seed'in tablolari bulmasi icin; sapma kontrolu `checks`te.
      - name: Prisma migrate (CI DB)
        run: npx prisma migrate deploy

      - name: Seed (E2E verisi)
        run: npx prisma db seed

      - name: E2E (Playwright)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ZORUNLU KONTROL. Ruleset `main-korumasi` bu job'un ADINI bekliyor; ad
  # degisirse PR'lar sonsuza dek "bekliyor"da kalir.
  #
  # `always()` BILEREK: `!cancelled()` olsaydi iptal edilen kosuda bu job
  # ATLANIRDI ve GitHub atlanan job'u gecmis sayar -- dogrulanmamis PR
  # birlestirilebilirdi. Uygulamaya dokunmayan PR'da (app=false) yesil doner,
  # eski tek-job `verify`in kosulla atlanmasiyla ayni sonuc.
  # ---------------------------------------------------------------------------
  verify:
    name: Dogrula (lint, tip, test, e2e)
    needs: [changes, checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dogrulama sonuclari
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes=$CHANGES app=$APP checks=$CHECKS e2e=$E2E"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Degisiklik kapsami olculemedi ($CHANGES)"; exit 1
          fi
          if [ "$APP" != "true" ]; then
            echo "Uygulamaya dokunmayan degisiklik; dogrulama gerekmiyor."; exit 0
          fi
          if [ "$CHECKS" != "success" ] || [ "$E2E" != "success" ]; then
            echo "::error::Dogrulama gecmedi (checks=$CHECKS, e2e=$E2E)"; exit 1
          fi
          echo "Tum dogrulama job'lari gecti."

  # ---------------------------------------------------------------------------
  # Uretim imaji.
  #
  # NEDEN AYRI BIR BUILD: `e2e` job'indaki build, E2E icin
  # `NEXT_PUBLIC_ENABLE_AUTH_DEMO=true` ile derlendi -- bayrak derleme aninda
  # gomuluyor. O ciktiyi uretime gondermek, demo giris dugmelerini canliya
  # tasirdi. Imaj bu yuzden kendi build'ini yapar; Docker katman onbellegi
  # (type=gha) tekrar maliyetini dusuk tutar.
  #
  # Yalnizca `main` push'unda. PR'da imaj uretilmez: PR'in isi dogrulamaktir.
  #
  # Dogrulamayla PARALEL kosar (`needs` yok), bu yuzden YALNIZCA degismez
  # `sha-<kisa sha>` etiketini basar, `latest`i DEGIL. Sunucu (compose,
  # scripts/update.sh) `latest` ceker; dogrulanmamis bir imaj o etikete
  # ulasirsa siradaki `pull` kirmizi commit'i canliya tasirdi. `latest`i
  # `deploy`, dogrulama gectikten sonra bu job'un digest'ine tasir.
  # ---------------------------------------------------------------------------
  image:
    name: Imaj (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imaj da iptal edilebilir: bir sonraki commit zaten yenisini uretecek.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - uses: actions/checkout@v4

      - name: GHCR girisi
        # SHA'ya sabitlendi (2026-09-10, depo public): tasinabilir surum
        # etiketleri (`@v3`), ust akista basi cekmis biri ustune yazarsa
        # kod incelemesinden gecmemis bir Action'i sessizce calistirabilirdi.
        # `docker/login-action` gizli GHCR parolasini isliyor -- imtiyazli.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiket ve etiketler
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Derle ve gonder
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            DATABASE_URL=postgresql://bagajpark:bagajpark@localhost:5432/bagajpark?schema=public
            AUTH_SECRET=docker-build-placeholder-not-for-production
            NEXT_PUBLIC_BETA_BADGE=true
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_CRISP_WEBSITE_ID=${{ vars.NEXT_PUBLIC_CRISP_WEBSITE_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            S3_PUBLIC_BASE_URL=${{ vars.S3_PUBLIC_BASE_URL }}

  # ---------------------------------------------------------------------------
  # Deploy. Eskiden AYRI bir workflow'daydi ve `CI`yi beklemiyordu -- yani
  # testleri kirmizi bir commit uretime cikabilirdi. Artik dogrulamanin her
  # parcasina ve imaja `needs` ile bagli; `success()` hepsini ister, biri
  # bile gecmezse deploy (ve `latest` terfisi) hic baslamaz.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (AWS SSM, OIDC — statik key yok)
    needs: [verify, checks, e2e, image]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ASLA iptal edilmez (`cancel-in-progress` yok) ve tek sirada calisir:
    # iki deploy ayni anda `docker compose up` cagirirsa sunucuda yaris olur.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    permissions:
      id-token: write
      contents: read
      # Yalnizca `latest` terfisi icin (asagida).
      packages: write

    steps:
      - name: Checkout (docker-compose.yml icin)
        uses: actions/checkout@v4

      - name: AWS kimligi (GitHub OIDC)
        # SHA'ya sabitlendi (2026-09-10): AWS'e rol ustlenen bu adim en
        # imtiyazli uc uye -- tasinabilir `@v4` etiketi buradaki tehdit
        # modelinde en riskli olani.
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy config'i ve public/ dosyalarini S3'e yukle
        # nginx `public/` dizinini sunucudaki /opt/emanetci/public'ten servis eder
        # (try_files $uri @next); imajin icindeki kopya DEGIL. Senkronlanmazsa
        # sw.js/manifest/ikonlar eski kalir (2026-08-23: eski service worker canlida kaldi).
        run: |
          aws s3 cp docker-compose.yml "s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/docker-compose.yml"
          # `sync` s3:ListBucket ister; github-deploy rolunde yalnizca PutObject var.
          # `cp --recursive` listeleme yapmaz. Sunucu tarafi `sync --delete` ile aynalar.
          aws s3 cp public/ "s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/public/" --recursive --only-show-errors
          # Sirlar Parameter Store'da; sunucu docker-compose.env'i bunlarla uretiyor.
          # Kutudaki git kopyasinin tazeligine guvenmiyoruz -- deploy yolu S3.
          aws s3 cp ops/secrets.manifest "s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/secrets.manifest"
          # scripts/ dizininin TAMAMI gidiyor -- yalnizca secrets-render.sh degil.
          #
          # NEDEN: 2026-08-29'da sekiz cron isi kurulunca hepsi dustu, cunku
          # sunucudaki call-internal-job.sh hala Hetzner donemindeki
          # /root/emanetci yolunu ariyordu. Duzeltme repoda AYLARDIR vardi ama
          # deploy scripts/ dizinini hic gondermiyordu: repodaki script ile
          # sunucudaki script ayri yasiyordu ve bunu kimse gormuyordu.
          aws s3 cp scripts/ "s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/scripts/" \
            --recursive --exclude "*.js" --exclude "*.mjs" --only-show-errors
          # nginx/conf.d de gidiyor -- scripts/ ile AYNI sebep, ayni sinif hata.
          #
          # NEDEN: docker-compose.yml bu uc dosyayi sunucudaki
          # /opt/emanetci/nginx/conf.d/'den bind-mount ediyor (docker-compose.yml
          # 157-159), imajin icinden DEGIL. Ama deploy onlari hic gondermiyordu:
          # repodaki nginx konfigi ile sunucudaki ayri yasiyordu ve bunu hicbir
          # sey gostermiyordu. scripts/ icin ayni delik 2026-08-29'da sekiz cron
          # isini birden dusurmustu; bu, onun nginx'teki ikizi.
          aws s3 cp nginx/conf.d/ "s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/nginx/conf.d/" \
            --recursive --only-show-errors

      # `latest`, dogrulanmis imajin digest'ine burada tasinir: deploy-production
      # sirasinda oldugu icin terfi sirasi deploy sirasiyla ayni. Yalnizca
      # manifest yazilir, katman cekilmez.
      - name: GHCR girisi
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Dogrulanmis imaji latest yap
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::image job'u digest vermedi: '$DIGEST'"; exit 1 ;;
          esac
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: SSM Run Command ile deploy et
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Project,Values=bagajpark-aws-test" \
            --comment "GitHub Actions deploy — ${{ github.sha }}" \
            --parameters commands='[
              "set -e",
              "aws s3 cp s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/docker-compose.yml /opt/emanetci/docker-compose.yml",
              "aws s3 sync s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/public/ /opt/emanetci/public/ --delete --only-show-errors",
              "aws s3 sync s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/scripts/ /opt/emanetci/scripts/ --only-show-errors",
              "aws s3 sync s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/nginx/conf.d/ /opt/emanetci/nginx/conf.d/ --only-show-errors",
              "aws s3 cp s3://${{ vars.AWS_DEPLOY_BUCKET }}/deploy-config/secrets.manifest /opt/emanetci/secrets.manifest",
              "chmod +x /opt/emanetci/scripts/*.sh",
              "chown -R ec2-user:ec2-user /opt/emanetci/scripts",
              "cd /opt/emanetci",
              "bash scripts/secrets-render.sh --prefix ${{ vars.SSM_APP_PARAMETER_PREFIX }} --out /opt/emanetci/docker-compose.env --manifest /opt/emanetci/secrets.manifest",
              "docker rm -f $(docker ps -aq --filter name=_emanetci-) 2>/dev/null || true",
              "docker compose --env-file docker-compose.env pull web --quiet",
              "docker compose --env-file docker-compose.env up -d --no-build",
              "docker compose --env-file docker-compose.env exec -T nginx nginx -t",
              "docker compose --env-file docker-compose.env restart nginx",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
              --query "CommandInvocations[0].Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deploy tamamlandı: $(date)"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deploy başarısız: $STATUS"
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" --output text
              exit 1
            fi
          done
          echo "❌ Timeout: komut 300s içinde tamamlanmadı"
          exit 1
