name: Mobile CI

# =============================================================================
# MALIYET NOTU (2026-08-26'da olculdu)
#
# GitHub macOS runner'larini Linux'un ON KATI faturalandirir. Bu dosyadaki iOS
# job'i 10 kosuda 18,2 dakika GERCEK sure harcadi ama faturaya 182 DAKIKA
# olarak yazildi -- private repo kotasinin (2000 dk/ay) yaklasik %9'u. Uretilen
# sey imzasiz bir debug `.app` idi.
#
# Bu yuzden iOS build'i artik OTOMATIK KOSMUYOR: elle (`workflow_dispatch`) ya
# da surum etiketiyle calisir. Dart tarafindaki hatalar zaten her push'ta
# yakalanir -- `flutter analyze` ve `flutter test` Android job'inda, Linux
# ucretiyle. iOS'a ozgu risk (Podfile, Xcode ayarlari, native eklenti) yalnizca
# `mobile/ios/**` degistiginde ortaya cikar ve o degisiklik nadirdir; oyle bir
# durumda bu workflow'u Actions sekmesinden elle tetikleyin.
# =============================================================================

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'mobile/**'
    branches: [ main, develop ]
  # iOS build'ini elle calistirmak icin.
  workflow_dispatch:
    inputs:
      ios:
        description: 'iOS build de calissin (macOS = 10x fatura)'
        type: boolean
        default: true

# Ustuste gelen push'larda yalnizca sonuncusu kosar.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ONCE ANALIZ/TEST/DERLEME, SONRA BICIMLENDIRME.
      #
      # NEDEN (2026-08-31'de olculdu): `dart format` adimi ILK siradaydi ve
      # 22 Agustos'tan beri HER kosuda kirmizi donuyordu -- 37 dosya bicim
      # disiydi, cogu aylardir oyle. Adim ilk sirada oldugu icin `flutter
      # analyze`, `flutter test` ve `flutter build apk` BIR HAFTADIR HIC
      # CALISMADI. Yani mobil tarafa giren her degisiklik, gercek kapilarin
      # hicbirinden gecmeden birakti.
      #
      # Sira degistirildi, GEVSETILMEDI: bicim bozuksa is yine KIRMIZI duser.
      # Fark, artik analiz/test/derleme sonuclarinin da gorunmesi. Bir kapinin
      # digerlerini maskelemesi, kapinin kendisinden daha buyuk bir sorun.
      #
      # Bicimlendirme borcu kapandiginda bu adim tekrar basa alinabilir; o zaman
      # sira farketmez.
      # `--no-fatal-infos`: HATA ve UYARI hala kirmizi dusurur, `info` seviyesi
      # dusurmez.
      #
      # NEDEN: `flutter analyze` varsayilan olarak `info`yu da olumcul sayiyor ve
      # agacta 60 tane var -- hepsi bicim/stil onerisi (`directives_ordering`,
      # `prefer_const_constructors`, `omit_local_variable_types`). Sonucu, kapinin
      # KALICI OLARAK kirmizi olmasiydi ve kalici kirmizi bir kapi hicbir seyi
      # korumaz: nitekim `Undefined name 'shop'` gibi ALTI DERLEME HATASI bu
      # yuzden gorunmedi.
      #
      # Ayrim bilincli: `error` ve `warning` gercek dogruluk sinyali, `info`
      # oneridir. Oneriler yine ciktida gorunuyor, yalnizca is dusurmuyor.
      # Borc kapandiginda bayrak kaldirilabilir.
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://bagajpark.com/api/mobile --dart-define=FIREBASE_ENABLED=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  build-ios:
    name: Build iOS
    # macOS = 10x fatura. Otomatik push/PR'da KOSMAZ; yalnizca elle tetiklenince
    # ya da bir surum etiketi push'landiginda. Gerekcesi dosyanin basinda.
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # Find the latest available Xcode 26.x
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode.app 2>/dev/null)
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (No codesign)
        run: flutter build ios --debug --no-codesign --dart-define=API_BASE_URL=https://bagajpark.com/api/mobile --dart-define=FIREBASE_ENABLED=false

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: mobile/build/ios/iphoneos/Runner.app
