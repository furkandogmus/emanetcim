name: Mobile Expo CI

# Expo kolunun (mobile-expo/) kapisi: typecheck + lint + tr/en anahtar paritesi
# + birim testler (`npm run verify`). Lint 2026-10-18'e kadar yapilandirmasizdi
# ve hicbir dosyayi taramiyordu.
# Daha once hic CI yoktu; typecheck'i kiran bir degisiklik fark edilmeden
# main'e girebiliyordu. Zorunlu kontrol DEGIL, o yuzden yol filtresi guvenli
# (zorunlu olsaydi filtre yuzunden hic kosmayan job PR'i sonsuza dek bekletirdi,
# bkz. mobile-ci.yml).

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/mobile-expo-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/mobile-expo-ci.yml'

concurrency:
  group: mobile-expo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Expo dogrulama (tip, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      # Kurallar ci.yml'deki node_modules onbellegiyle ayni: anahtar package.json +
      # lockfile + Node surumu; iska olursa `npm ci` kosar ve hemen kaydedilir.
      - name: node_modules onbellegi
        id: nm-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile-expo/node_modules
          key: expo-node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('mobile-expo/package.json', 'mobile-expo/package-lock.json') }}
      - name: Bagimliliklar
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: node_modules onbellegini kaydet
        if: steps.nm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile-expo/node_modules
          key: ${{ steps.nm-cache.outputs.cache-primary-key }}
      - run: npm run verify
