name: Mobile Expo CI

# Expo kolunun (mobile-expo/) kapisi: typecheck + lint + tr/en anahtar paritesi
# + birim testler (`npm run verify`). Lint 2026-10-18'e kadar yapilandirmasizdi
# ve hicbir dosyayi taramiyordu.
# Daha once hic CI yoktu; typecheck'i kiran bir degisiklik fark edilmeden
# main'e girebiliyordu. Zorunlu kontrol DEGIL, o yuzden yol filtresi guvenli
# (zorunlu olsaydi filtre yuzunden hic kosmayan job PR'i sonsuza dek bekletirdi,
# bkz. mobile-ci.yml).

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/mobile-expo-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/mobile-expo-ci.yml'

concurrency:
  group: mobile-expo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Expo dogrulama (tip, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-expo/package-lock.json
      - run: npm ci
      - run: npm run verify
