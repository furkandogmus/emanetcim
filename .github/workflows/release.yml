name: Release

# package.json sürümü + git tag (ör. v0.2.0) push edilince GitHub Release oluşturur.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pre-release checklist (bilgi)
        run: |
          echo "Kontrol: staging smoke, migration notu, rollback sorumlusu, prod env doğrulaması (AUTH_SECRET, iyzico, CRON_SECRET)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
