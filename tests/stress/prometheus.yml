global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "bagajpark-health"
    metrics_path: /api/health
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:3000"]
